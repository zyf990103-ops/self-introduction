<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="赵宇凡的个人主页。观看两段自我介绍视频，了解我的故事。">
  <title>赵宇凡 · 个人主页</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #111619;
      color: #f4f4ed;
      --muted: #acb8b7;
      --line: #ffffff24;
      --accent: #d7f98d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .shell { width: min(1120px, calc(100% - 96px)); margin-inline: auto; }
    .top, .foot { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .top { min-height: 88px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 650; letter-spacing: .12em; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid #d7f98d63; color: var(--accent); border-radius: 50%; font-size: 11px; letter-spacing: 0; }
    .top nav { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: flex-end; }
    .hero-action { margin-top: 30px; }
    .top a, .foot { font-size: 13px; color: var(--muted); }
    .top a:hover, .number:hover { color: var(--accent); }
    .hero { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 24px; padding-block: 55px; }
    .eyebrow { display: flex; align-items: center; gap: 11px; margin: 0; font-size: 12px; letter-spacing: .19em; color: var(--accent); }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
    .greeting { margin: 29px 0 10px; font-size: 20px; color: var(--muted); }
    h1 { margin: 0; font-size: clamp(58px, 8.1vw, 112px); line-height: 1.13; letter-spacing: -.065em; }
    .roman { margin: 20px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .26em; }
    .art { width: 100%; max-width: 510px; justify-self: end; height: auto; display: block; }
    .intro { padding-block: 32px 62px; border-top: 1px solid var(--line); }
    .intro h2 { margin: 14px 0 8px; font-size: clamp(30px, 5vw, 48px); letter-spacing: -.04em; }
    .intro-copy { margin: 0 0 26px; line-height: 1.7; color: var(--muted); }
    .films { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .film { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: #1a2224; }
    .film video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #0a0f10; }
    .film video:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
    .film-info { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 20px; }
    .film-info h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .film-info span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .contact { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; justify-content: space-between; padding: 30px 34px; border: 1px solid var(--line); background: #1a2224; border-radius: 18px; }
    .contact h2 { font-size: 14px; font-weight: 500; color: var(--muted); margin: 0 0 8px; }
    .number { font-variant-numeric: tabular-nums; font-size: clamp(26px, 4vw, 40px); font-weight: 630; letter-spacing: -.035em; }
    .call { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; gap: 12px; padding: 0 20px; border-radius: 8px; background: var(--accent); color: #162012; font-size: 14px; font-weight: 700; }
    .call:hover { background: #e6ffae; }
    .foot { min-height: 76px; }
    @media (max-width: 700px) {
      .shell { width: calc(100% - 40px); }
      .top { min-height: 65px; }
      .hero { grid-template-columns: 1fr; gap: 12px; padding-block: 43px 21px; }
      .art { max-width: 390px; justify-self: center; }
      .top nav { gap: 8px 14px; }
      .intro { padding-block: 26px 36px; }
      .films { grid-template-columns: 1fr; }
      .contact { padding: 22px; gap: 18px; }
      .foot { min-height: 64px; }
    }
  </style>
</head>
<body>
  <header class="top shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">ZYF</span>赵宇凡</div>
    <nav aria-label="页面导航"><a href="#intro">自我介绍</a><a href="#contact">联系方式 <span aria-hidden="true">↘</span></a></nav>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="name">
      <div>
        <p class="eyebrow">个人主页</p>
        <p class="greeting">你好，我是</p>
        <h1 id="name">赵宇凡</h1>
        <p class="roman" lang="en">ZHAO YUFAN</p>
        <a class="call hero-action" href="#intro">观看自我介绍 <span aria-hidden="true">↓</span></a>
      </div>
      <svg class="art" viewBox="0 0 480 395" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="orbit" x1="0" x2="1" y1="0" y2="1" gradientUnits="objectBoundingBox">
            <stop stop-color="#d7f98d" stop-opacity=".75"/>
            <stop offset="1" stop-color="#739e91" stop-opacity=".17"/>
          </linearGradient>
          <radialGradient id="glow">
            <stop stop-color="#385849" stop-opacity=".85"/>
            <stop offset="1" stop-color="#111619" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <ellipse cx="240" cy="198" rx="216" ry="182" fill="url(#glow)"/>
        <g fill="none" stroke="url(#orbit)">
          <circle cx="240" cy="198" r="146" stroke-dasharray="2 7"/>
          <circle cx="240" cy="198" r="124"/>
          <circle cx="240" cy="198" r="94" opacity=".45"/>
          <ellipse cx="240" cy="198" rx="184" ry="61" transform="rotate(-31 240 198)"/>
          <ellipse cx="240" cy="198" rx="184" ry="61" transform="rotate(31 240 198)" opacity=".56"/>
          <path d="M240 28v340M70 198h340" opacity=".22"/>
        </g>
        <circle cx="361" cy="114" r="6" fill="#d7f98d"/>
        <circle cx="124" cy="279" r="4" fill="#a7ce88"/>
        <circle cx="286" cy="336" r="3" fill="#75968a"/>
        <path d="M108 85v18m-9-9h18m261 189v14m-7-7h14" stroke="#afccad" opacity=".75"/>
        <text x="240" y="217" fill="#f4f4ed" text-anchor="middle" font-size="56" font-weight="650" letter-spacing="-3">ZYF</text>
      </svg>
    </section>
    <section class="intro" id="intro" aria-labelledby="intro-title">
      <p class="eyebrow" lang="en">ON VIDEO</p>
      <h2 id="intro-title">视频里的我</h2>
      <p class="intro-copy">用两段短片认识我，也看看我开的茶室。</p>
      <div class="films">
        <article class="film">
          <video controls playsinline preload="none" poster="media/intro-01.jpg" aria-labelledby="film-01">
            <source src="media/intro-01.mp4" type="video/mp4">
            <a href="media/intro-01.mp4">下载这段自我介绍</a>
          </video>
          <div class="film-info">
            <h3 id="film-01">认识赵宇凡</h3>
            <span>0:42</span>
          </div>
        </article>
        <article class="film">
          <video controls playsinline preload="none" poster="media/intro-02.jpg" aria-labelledby="film-02">
            <source src="media/intro-02.mp4" type="video/mp4">
            <a href="media/intro-02.mp4">下载这段自我介绍</a>
          </video>
          <div class="film-info">
            <h3 id="film-02">我的茶室</h3>
            <span>0:35</span>
          </div>
        </article>
      </div>
    </section>
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div>
        <h2 id="contact-title">联系电话</h2>
        <a class="number" href="tel:15061716556">150 6171 6556</a>
      </div>
      <a class="call" href="tel:15061716556">拨打电话 <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <footer class="foot shell"><span>赵宇凡</span><span>个人主页</span></footer>
</body>
</html>
