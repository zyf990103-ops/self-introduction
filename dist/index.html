<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="赵宇凡的个人主页。两段短片，认识我、小狗多多和我的茶室。">
  <title>赵宇凡 · 个人主页</title>
  <style>
    :root {
      --paper: #f3f2e8;
      --red: #bc3828;
      --pink: #ebc3c9;
      --yellow: #ffeb51;
      --ink: #24211d;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--red);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid currentColor; outline-offset: 5px; }
    h1, h2, h3, p, figure { margin: 0; }
    .wrap { width: min(1500px, 100%); margin-inline: auto; padding-inline: clamp(20px, 3.1vw, 48px); }
    .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 14px; min-height: 70px; }
    .brand { display: inline-flex; align-items: center; justify-self: start; gap: 9px; padding-block: 15px; font-size: 20px; font-weight: 900; white-space: nowrap; }
    .brand svg { width: 30px; height: 30px; }
    .top nav { display: flex; justify-content: center; gap: clamp(16px, 4vw, 52px); padding-block: 23px; font-size: 14px; font-weight: 700; }
    .pill { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; gap: 12px; padding: 10px 20px; border: 1px solid currentColor; border-radius: 999px; font-weight: 800; transition: transform .18s ease, background .18s ease; }
    .pill:hover { transform: translateY(-3px); }
    .top .pill { justify-self: end; padding: 14px 20px 17px; border: 0; border-radius: 0 0 21px 21px; background: var(--red); color: var(--paper); font-size: 14px; }
    .top nav a:hover { text-decoration: underline; text-underline-offset: 5px; }
    .hero { position: relative; isolation: isolate; display: grid; grid-template-columns: 1fr 1.55fr 1fr; min-height: clamp(550px, 52vw, 770px); padding-top: clamp(24px, 4vw, 55px); }
    .hero-copy, .hero-side { position: relative; z-index: 2; }
    .hero-copy { grid-column: 1; grid-row: 1; }
    .label { display: inline-block; font-size: 13px; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 19px 0 26px; font-size: clamp(56px, 8vw, 125px); line-height: 1.03; font-weight: 950; letter-spacing: -.1em; white-space: nowrap; }
    h1 span { display: block; }
    h1:focus { outline: none; }
    .hero-side { grid-column: 3; grid-row: 1; justify-self: end; align-self: end; text-align: right; padding-bottom: clamp(40px, 6vw, 92px); }
    .hero-line { margin-top: 14px; font-size: clamp(36px, 6.15vw, 92px); line-height: 1.02; font-weight: 950; letter-spacing: -.09em; white-space: nowrap; }
    .hero-art { position: absolute; z-index: 1; inset: auto 19% 0; height: 99%; }
    .photo { position: absolute; inset: 3% 5% 0; overflow: hidden; border-radius: 32% 46% 6% 5% / 26% 38% 8% 7%; background: #dcc2a8; transform: rotate(-4deg); }
    .photo img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 24% center; transform: scale(1.045) rotate(4deg); }
    .scribble { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .sticker { position: absolute; right: 1%; bottom: 20%; display: grid; place-content: center; width: clamp(62px, 8vw, 116px); aspect-ratio: 1; border: 2px solid var(--red); border-radius: 50%; background: var(--yellow); font-size: clamp(12px, 1.6vw, 24px); font-weight: 900; line-height: 1.2; text-align: center; transform: rotate(12deg); }
    .ribbon { position: relative; z-index: 3; margin-top: -4px; padding: 13px 20px; overflow: hidden; background: var(--red); color: var(--paper); text-align: center; font-size: clamp(11px, 2.3vw, 15px); font-weight: 800; letter-spacing: .12em; }
    .intro { padding-block: clamp(55px, 9vw, 128px); }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: clamp(24px, 4vw, 52px); }
    h2 { font-size: clamp(44px, 7.5vw, 108px); font-weight: 950; line-height: .98; letter-spacing: -.09em; }
    .section-heading h2 { margin-top: 12px; }
    .section-heading p { color: var(--ink); font-size: clamp(14px, 1.6vw, 19px); line-height: 1.6; }
    .films { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 2vw, 30px); }
    .film { min-width: 0; padding: clamp(14px, 2vw, 24px); border: 1.5px solid var(--red); border-radius: 24px; background: var(--pink); }
    .film:nth-child(2) { background: #f8e48f; }
    .film-head { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .film-index { font-size: clamp(26px, 4vw, 51px); line-height: 1; font-weight: 900; letter-spacing: -.07em; }
    .film video { display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--ink); }
    .film h3 { margin: 17px 0 5px; font-size: clamp(23px, 3vw, 37px); font-weight: 900; letter-spacing: -.05em; }
    .film p { color: var(--ink); font-size: 15px; line-height: 1.6; }
    .contact { background: var(--red); color: var(--paper); }
    .contact .wrap { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 24px; padding-block: clamp(45px, 7vw, 92px); }
    .contact h2 { margin-top: 10px; font-size: clamp(45px, 6.8vw, 91px); }
    .contact-actions { display: grid; justify-items: start; gap: 10px; }
    .number { font-size: clamp(24px, 3.5vw, 44px); font-weight: 800; font-variant-numeric: tabular-nums; }
    .foot { display: flex; justify-content: space-between; gap: 16px; padding-block: 18px; font-size: 13px; font-weight: 700; }
    .welcome { position: fixed; inset: 0; width: 100%; max-width: none; height: 100%; max-height: none; padding: 20px; margin: 0; border: 0; background: var(--pink); color: var(--red); text-align: center; }
    .welcome[open] { display: grid; place-items: center; }
    .welcome::backdrop { background: var(--pink); }
    .welcome h2 { font-size: clamp(47px, 9vw, 115px); }
    .welcome p { margin-top: 15px; font-size: 14px; font-weight: 750; }
    .ball { display: grid; place-items: center; width: clamp(70px, 8vw, 105px); aspect-ratio: 1; margin: 25px auto 14px; padding: 0; background: var(--yellow); color: var(--red); border: 1.5px solid var(--red); border-radius: 50%; box-shadow: 0 7px 0 #bc38283b; }
    .ball svg { width: 100%; height: 100%; }
    .ball:hover { transform: rotate(-15deg); }
    .ball.bounce { animation: bounce .38s ease both; }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-42px) rotate(22deg); } }
    .skip { padding: 8px 12px; background: none; color: inherit; border: 0; text-decoration: underline; text-underline-offset: 4px; }
    @media (max-width: 760px) {
      .top { grid-template-columns: auto 1fr; min-height: 62px; }
      .top nav { justify-content: end; gap: 17px; font-size: 13px; }
      .top .pill { display: none; }
      .hero { grid-template-columns: 1fr 1fr; min-height: 0; padding-top: 18px; }
      .hero-copy { grid-column: 1 / -1; grid-row: 1; }
      h1 { margin: 9px 0 15px; font-size: clamp(40px, 9vw, 66px); }
      h1 span { display: inline; }
      .hero-art { position: relative; grid-column: 1 / -1; grid-row: 2; inset: auto; width: min(100%, 470px); height: auto; aspect-ratio: 1.1; justify-self: center; margin-top: 12px; }
      .hero-side { grid-column: 2; grid-row: 2; align-self: end; padding-bottom: 17px; }
      .hero-side .label { font-size: 11px; }
      .hero-line { margin-top: 5px; font-size: clamp(30px, 7vw, 51px); }
      .hero-side { color: var(--paper); text-shadow: 0 2px 6px #521f15, 0 0 12px #521f15; }
      .sticker { bottom: 31%; }
      .section-heading { display: grid; gap: 10px; }
      .films { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <dialog class="welcome" aria-labelledby="welcome-title">
    <div>
      <h2 id="welcome-title">点一下小球<br>来认识我</h2>
      <p>赵宇凡的个人主页</p>
      <button class="ball" type="button" aria-label="弹一下小球，进入主页">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
          <path d="M2 57c27 9 65 3 96-21M22 10c41 17 54 48 31 86M81 12c-18 23-19 48 6 69"/>
        </svg>
      </button>
      <button class="skip" type="button">直接进入</button>
    </div>
  </dialog>
  <header class="top wrap" id="top">
    <a class="brand" href="#top">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="currentColor"><path d="M16 14c-4 0-5 4-8 7-3 3-1 7 3 7 2 0 3-1 5-1s3 1 5 1c4 0 6-4 3-7-3-3-4-7-8-7z"/><ellipse cx="5" cy="13" rx="3" ry="4" transform="rotate(-27 5 13)"/><ellipse cx="12" cy="7" rx="3" ry="4.5" transform="rotate(-12 12 7)"/><ellipse cx="20" cy="7" rx="3" ry="4.5" transform="rotate(12 20 7)"/><ellipse cx="27" cy="13" rx="3" ry="4" transform="rotate(27 27 13)"/></svg>
      赵宇凡
    </a>
    <nav aria-label="页面导航"><a href="#intro">自我介绍</a><a href="#contact">联系方式</a></nav>
    <a class="pill" href="#contact">打个招呼 <span aria-hidden="true">↗</span></a>
  </header>
  <main>
    <section class="hero wrap" aria-labelledby="name">
      <div class="hero-copy">
        <p class="label">个人主页</p>
        <h1 id="name" tabindex="-1"><span>你好，</span><span>我是</span><span>赵宇凡</span></h1>
        <a class="pill" href="#intro">看两段短片 <span aria-hidden="true">↓</span></a>
      </div>
      <figure class="hero-art">
        <div class="photo"><img src="media/intro-01.jpg" width="768" height="432" alt="戴草帽的赵宇凡抱着小狗多多"></div>
        <svg class="scribble" viewBox="0 0 600 580" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true">
          <path stroke-width="4" d="M36 123Q63 108 100 102M52 80q19 4 34 13M477 49q37 7 66 40M507 35l27 9M521 492q36-10 60-31M539 510l32-12"/>
          <path stroke-width="3" d="M41 411c30-42 36-15 19 9-22 30-14 54 4 39 9-7 26-19 37-10"/>
          <path stroke-width="3" d="M471 96l5 13 14 3-13 6-4 14-6-13-13-4 13-6z"/>
        </svg>
        <span class="sticker" aria-hidden="true">多多<br>出镜</span>
      </figure>
      <div class="hero-side">
        <p class="label">小狗多多 · 一间茶室</p>
        <p class="hero-line">我的<br>日常。</p>
      </div>
    </section>
    <div class="ribbon">两段短片 ✦ 认识我 ✦ 看看我的茶室</div>
    <section class="intro wrap" id="intro" aria-labelledby="intro-title">
      <header class="section-heading">
        <div><span class="label">自我介绍</span><h2 id="intro-title">视频里的我</h2></div>
        <p>第一段见见我和多多，<br>第二段去我的茶室坐一坐。</p>
      </header>
      <div class="films">
        <article class="film">
          <div class="film-head"><span class="film-index">01</span><span aria-label="42 秒">0:42</span></div>
          <video controls playsinline preload="none" poster="media/intro-01.jpg" aria-labelledby="film-01">
            <source src="media/intro-01.mp4" type="video/mp4">
            <a href="media/intro-01.mp4">打开第一段视频</a>
          </video>
          <h3 id="film-01">我和多多</h3>
          <p>戴上草帽，抱起多多，跟你打个招呼。</p>
        </article>
        <article class="film">
          <div class="film-head"><span class="film-index">02</span><span aria-label="35 秒">0:35</span></div>
          <video controls playsinline preload="none" poster="media/intro-02.jpg" aria-labelledby="film-02">
            <source src="media/intro-02.mp4" type="video/mp4">
            <a href="media/intro-02.mp4">打开第二段视频</a>
          </video>
          <h3 id="film-02">我的茶室</h3>
          <p>泡一杯茶，也看看我做的紫砂刻绘。</p>
        </article>
      </div>
    </section>
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div class="wrap">
        <div><span class="label">联系方式</span><h2 id="contact-title">打个招呼吧。</h2></div>
        <div class="contact-actions">
          <a class="number" href="tel:15061716556">150 6171 6556</a>
          <a class="pill" href="tel:15061716556">拨打电话 <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>
  </main>
  <footer class="foot wrap"><span>赵宇凡 · 个人主页</span><a href="#top">回到顶部 ↑</a></footer>
  <script>
    const welcome = document.querySelector('.welcome');
    const ball = welcome.querySelector('.ball');
    let visited = false;
    try { visited = sessionStorage.getItem('zyf-welcome-seen') === 'yes'; } catch {}
    if (!visited && !location.hash && typeof welcome.showModal === 'function') welcome.showModal();
    welcome.addEventListener('close', () => {
      try { sessionStorage.setItem('zyf-welcome-seen', 'yes'); } catch {}
      document.querySelector('#name').focus({ preventScroll: true });
    });
    welcome.querySelector('.skip').addEventListener('click', () => welcome.close());
    ball.addEventListener('animationend', () => welcome.close());
    ball.addEventListener('click', () => ball.classList.add('bounce'));

    const films = [...document.querySelectorAll('.film video')];
    for (const film of films) {
      film.addEventListener('play', () => {
        for (const other of films) {
          if (other !== film) other.pause();
        }
      });
    }
  </script>
</body>
</html>
