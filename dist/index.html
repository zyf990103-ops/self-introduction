<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="赵宇凡的个人主页。观看两段自我介绍视频，了解我的故事。">
  <title>赵宇凡 · 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffaf2;
      --ink: #37251f;
      --muted: #725043;
      --line: #edc6ad;
      --red: #b94132;
      --serif: "Songti SC", "Noto Serif CJK SC", "SimSun", "STSong", serif;
      background: var(--paper);
      color: var(--ink);
      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      border-top: 4px solid #f18468;
      background: radial-gradient(ellipse at 79% 22%, #ffcb8960, transparent 52%),
        linear-gradient(180deg, #fffdf9 10%, transparent 68%);
    }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--red); outline-offset: 4px; }
    .shell { width: min(1080px, calc(100% - 64px)); margin-inline: auto; }
    .top, .foot, .brand, .top nav { display: flex; align-items: center; gap: 16px; }
    .top, .foot { justify-content: space-between; }
    .top { min-height: 76px; border-bottom: 1px solid var(--line); }
    .brand { font: 700 19px var(--serif); }
    .brand-mark {
      display: grid; place-items: center; width: 34px; height: 34px;
      background: var(--red); color: #fff8ed; outline: 1px solid #fff8ed;
      outline-offset: -4px; transform: rotate(-5deg);
    }
    .top nav { flex-wrap: wrap; justify-content: flex-end; }
    .top a, .foot { font-size: 13px; color: var(--muted); }
    .top a:hover, .number:hover { color: var(--red); }
    .hero {
      display: grid; grid-template-columns: 1fr 1.12fr; align-items: center;
      gap: clamp(24px, 6vw, 72px); padding-block: clamp(42px, 8vw, 104px);
    }
    h1, h2, h3, .eyebrow, .greeting { font-family: var(--serif); }
    .eyebrow { display: flex; align-items: center; gap: 12px; margin: 0; color: var(--red); letter-spacing: .12em; font-weight: 700; }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: currentColor; }
    .greeting { margin: 24px 0 8px; color: var(--muted); font-size: 18px; }
    h1 { margin: 0; font-size: clamp(54px, 9vw, 106px); line-height: 1.08; letter-spacing: -.06em; }
    .roman { margin: 18px 0 0; font: 12px Georgia, serif; letter-spacing: .28em; color: var(--muted); }
    .call {
      display: inline-flex; align-items: center; gap: 18px; min-height: 46px;
      padding: 0 18px; border-radius: 6px; background: var(--red); color: #fffaf4;
      font-size: 14px; font-weight: 700;
    }
    .call:hover { background: #a33025; }
    .hero-action { margin-top: 28px; }
    .scroll {
      margin: 0; min-width: 0; padding: 8px; border-radius: 14px; border: 1px solid #f2c5a8;
      background: #fff3e2; box-shadow: 0 15px 32px #b7482719;
    }
    .art { width: 100%; height: auto; display: block; border: 1px solid #f6d6be; border-radius: 8px; }
    .intro { padding-block: 32px 56px; border-top: 1px solid var(--line); }
    .intro h2 { margin: 12px 0 8px; font-size: clamp(32px, 5vw, 52px); }
    .intro-copy { margin: 0 0 24px; color: var(--muted); line-height: 1.7; }
    .films { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .film { min-width: 0; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: #fffdf8; }
    .film video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #37251f; }
    .film video:focus-visible { outline-offset: -4px; }
    .film-info { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
    .film-info h3 { flex: 1; margin: 0; font-size: 17px; }
    .film-info span { font-size: 13px; color: var(--muted); }
    .film-info .clip { color: var(--red); font-family: var(--serif); }
    .contact {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 18px; padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: #ffedda;
    }
    .contact h2 { margin: 0 0 8px; font-size: 15px; color: var(--muted); }
    .number { font: clamp(24px, 4vw, 36px) Georgia, serif; }
    .foot { min-height: 68px; }
    @media (max-width: 700px) {
      .shell { width: calc(100% - 32px); }
      .top { min-height: 64px; }
      .top nav { gap: 8px 12px; }
      .hero, .films { grid-template-columns: 1fr; }
      .scroll { width: 100%; max-width: 500px; }
    }
  </style>
</head>
<body>
  <header class="top shell">
    <div class="brand"><span class="brand-mark" aria-hidden="true">赵</span>赵宇凡</div>
    <nav aria-label="页面导航"><a href="#intro">自我介绍</a><a href="#contact">联系方式 <span aria-hidden="true">↘</span></a></nav>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="name">
      <div>
        <p class="eyebrow">壹 · 个人小传</p>
        <p class="greeting">你好，我是</p>
        <h1 id="name">赵宇凡</h1>
        <p class="roman" lang="en">ZHAO YUFAN</p>
        <a class="call hero-action" href="#intro">观看自我介绍 <span aria-hidden="true">↓</span></a>
      </div>
      <figure class="scroll" aria-hidden="true">
        <svg class="art" viewBox="0 0 520 380" focusable="false">
          <defs>
            <linearGradient id="rice-paper" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#fff3d9"/>
              <stop offset="1" stop-color="#ffe2b8"/>
            </linearGradient>
          </defs>
          <rect width="520" height="380" fill="url(#rice-paper)"/>
          <circle cx="342" cy="106" r="60" fill="#ffe5b9"/>
          <circle cx="342" cy="106" r="43" fill="#ef7355"/>
          <path d="M0 236Q58 204 107 154T194 150Q219 185 239 181T314 157Q357 163 377 195T520 224V380H0Z" fill="#ffd08c"/>
          <path d="M0 265Q69 238 134 183T219 184Q250 223 289 218T372 192Q412 192 443 234T520 259V380H0Z" fill="#f4ab7d"/>
          <path d="M0 288Q73 309 143 250T248 251Q283 282 332 256T423 246Q461 268 520 275V380H0Z" fill="#df816b"/>
          <path d="M0 301Q90 325 174 287T316 282Q397 311 520 284V380H0Z" fill="#fff0da"/>
          <g fill="none" stroke="#d59573" stroke-width="1" opacity=".7">
            <path d="M18 320Q105 334 174 311T311 305Q400 326 500 303"/>
            <path d="M116 346Q176 346 231 331T348 328Q396 338 455 327"/>
            <path d="M218 360Q267 348 322 351T405 351"/>
          </g>
          <g fill="#99554b">
            <path d="M0 309Q41 303 94 320L0 340Z"/>
            <path d="M38 320Q38 277 51 244Q43 282 48 319Z"/>
            <path d="M42 275Q18 252 13 257Q27 257 42 281ZM46 265Q63 245 78 249Q64 250 45 272Z"/>
            <path d="M45 284Q67 267 88 271Q63 275 45 290Z"/>
          </g>
          <g fill="none" stroke="#99554b" stroke-width="1.5" stroke-linecap="round">
            <path d="M187 100q7-6 14 0q7-6 14 0M224 82q5-4 10 0q5-4 10 0"/>
          </g>
          <g transform="translate(440 43) rotate(4)">
            <rect width="40" height="40" rx="2" fill="#b94132"/>
            <rect x="4" y="4" width="32" height="32" fill="none" stroke="#fff6eb"/>
            <text x="20" y="27" fill="#fff6eb" text-anchor="middle" font-size="19" style="font-family:var(--serif)">赵</text>
          </g>
        </svg>
      </figure>
    </section>
    <section class="intro" id="intro" aria-labelledby="intro-title">
      <p class="eyebrow">贰 · 两段影像</p>
      <h2 id="intro-title">视频里的我</h2>
      <p class="intro-copy">用两段短片认识我，也看看我开的茶室。</p>
      <div class="films">
        <article class="film">
          <video controls playsinline preload="none" poster="media/intro-01.jpg" aria-labelledby="film-01">
            <source src="media/intro-01.mp4" type="video/mp4">
            <a href="media/intro-01.mp4">下载这段自我介绍</a>
          </video>
          <div class="film-info">
            <span class="clip" aria-hidden="true">壹</span>
            <h3 id="film-01">认识赵宇凡</h3>
            <span>0:42</span>
          </div>
        </article>
        <article class="film">
          <video controls playsinline preload="none" poster="media/intro-02.jpg" aria-labelledby="film-02">
            <source src="media/intro-02.mp4" type="video/mp4">
            <a href="media/intro-02.mp4">下载这段自我介绍</a>
          </video>
          <div class="film-info">
            <span class="clip" aria-hidden="true">贰</span>
            <h3 id="film-02">我的茶室</h3>
            <span>0:35</span>
          </div>
        </article>
      </div>
    </section>
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <div>
        <h2 id="contact-title">联系电话</h2>
        <a class="number" href="tel:15061716556">150 6171 6556</a>
      </div>
      <a class="call" href="tel:15061716556">拨打电话 <span aria-hidden="true">↗</span></a>
    </section>
  </main>
  <footer class="foot shell"><span>赵宇凡</span><span>个人主页</span></footer>
</body>
</html>
