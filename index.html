<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="赵宇凡的个人主页。来看看我和多多的日常，也来我的茶室坐一坐。">
  <title>赵宇凡 · 日常小铺</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaef;
      --pink: #fbe3f1;
      --sky: #cde5f3;
      --red: #e6003d;
      --blue: #3866ad;
      --heading: #4777ba;
      --hand: "Wawati SC", "Hannotate SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--blue);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; }
    h1, h2, h3, p, figure { margin: 0; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 3px dashed currentColor; outline-offset: 5px; }
    svg { display: block; }
    .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 16px 8.5% 0; }
    .brand { font: 900 clamp(31px, 3.6vw, 51px)/1.12 var(--hand); letter-spacing: .02em; color: var(--red); white-space: nowrap; }
    .top > .tool:last-of-type { justify-self: end; }
    .tool { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; }
    .tool:hover { background: var(--sky); }
    .tool svg { width: 20px; height: 20px; }
    .nav { grid-column: 1 / -1; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px clamp(12px, 2.1vw, 27px); padding: 12px 0 20px; }
    .nav a { padding: 4px 0; font-size: 13px; letter-spacing: .1em; }
    .nav a:first-child, .nav a:hover { text-decoration: underline; text-underline-offset: 5px; }
    .hero {
      display: grid; grid-template-rows: auto 1fr; align-items: center;
      min-height: min(58.5vw, 810px);
      background: repeating-linear-gradient(90deg, var(--sky) 0 7.65vw, var(--pink) 7.65vw 15.3vw, var(--paper) 15.3vw 22.95vw);
      padding: clamp(20px, 4.1vw, 57px) 2.3% clamp(20px, 3.8vw, 55px);
    }
    .mottos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; font: 800 clamp(10px, 1.55vw, 22px)/1.45 var(--hand); letter-spacing: .025em; }
    .hero-art { display: grid; place-items: center; align-content: center; padding-top: clamp(18px, 4vw, 53px); }
    .mascots { width: min(50vw, 710px); height: auto; color: var(--red); }
    .hero h1 { width: max-content; max-width: 100%; margin-top: -1.15vw; color: var(--red); font: 900 clamp(39px, 7.3vw, 104px)/1.13 var(--hand); letter-spacing: -.045em; transform: rotate(-3deg); }
    .hero h1 span { display: inline-block; transform: rotate(4deg); }
    .section { width: min(100%, 1600px); margin-inline: auto; padding-inline: 2.25%; }
    h2 { text-align: center; font: 800 clamp(29px, 4vw, 55px)/1.2 var(--hand); color: var(--heading); }
    .collection h2 { padding: clamp(20px, 2.35vw, 36px) 0 clamp(25px, 3.9vw, 58px); }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5%; }
    .card { aspect-ratio: 1; display: grid; grid-template-rows: auto 1fr; text-align: center; padding: 7.5% 5% 4%; background: var(--sky); transition: transform .18s ease; }
    .card:nth-child(2) { background: var(--pink); color: var(--red); }
    .card:hover { transform: translateY(-4px) rotate(-1deg); }
    .card h3 { font: 900 clamp(20px, 5.25vw, 70px)/1.12 var(--hand); letter-spacing: -.065em; transform: rotate(-3deg); }
    .card svg { width: 100%; height: 100%; max-height: 100%; min-height: 0; }
    .about { padding-block: clamp(32px, 4.4vw, 64px); }
    .about > p { max-width: 39em; margin: 14px auto clamp(24px, 4.5vw, 58px); text-align: center; font: 600 clamp(15px, 1.5vw, 20px)/1.9 var(--hand); }
    .films { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2%; max-width: 1050px; margin-inline: auto; }
    .film { padding: 12px; background: var(--sky); }
    .film:nth-child(2) { background: var(--pink); }
    .film h3 { margin: 5px 3px 12px; font: 800 clamp(20px, 2.2vw, 29px)/1.1 var(--hand); }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #231f20; }
    .contact { padding: 44px 20px 47px; text-align: center; background: var(--sky); }
    .contact p { margin: 14px 0 12px; }
    .number { display: inline-block; padding: 10px 18px; border: 2px solid currentColor; border-radius: 999px; font-weight: 750; }
    .number:hover { background: var(--paper); }
    .foot { display: flex; justify-content: space-between; gap: 14px; padding-block: 18px; font-size: 13px; }
    @media (max-width: 600px) {
      .top { padding: 9px 4% 0; }
      .nav { gap: 6px 14px; padding-bottom: 12px; }
      .nav a { font-size: 12px; }
      .hero { min-height: 0; padding-bottom: 22px; background-size: auto; }
      .mottos { gap: 5px; }
      .hero-art { padding-top: 20px; }
      .mascots { width: 75vw; }
      .hero h1 { margin-top: -1vw; }
      .section { padding-inline: 3%; }
      .card h3 { font-size: clamp(15px, 4.6vw, 27px); }
      .films { grid-template-columns: 1fr; gap: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card { transition: none; }
    }
  </style>
</head>
<body>

  <script>
    const films = document.querySelectorAll('video');
    for (const film of films) {
      film.addEventListener('play', () => {
        for (const other of films) {
          if (other !== film) other.pause();
        }
      });
    }
  </script>
